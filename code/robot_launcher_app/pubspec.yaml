name: robot_launcher_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  rotary_knob:
    git:
      url: https://github.com/Amirht84/flutter_rotary_knob.git
      ref: v0.1.1
      path: rotary_knob
  flutter_svg: ^2.2.1
  core:
    path: ../core


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets: 
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.jpg"
